<div class="app-shell">
  @if (!hideNavbar()) {
  <header class="navbar">
    <div class="nav-left">
      @if (showSidebarToggle()) {
        <button
          class="sidebar-menu-btn"
          (click)="adminUi.toggleSidebar()"
          [title]="adminUi.sidebarOpen() ? 'Ocultar módulos' : 'Mostrar módulos'"
        >
          <app-icon name="menu" [size]="20" />
        </button>
      }
      <a routerLink="/" class="nav-brand">
        <div class="brand-logo">
          <app-icon name="sparkles" [size]="20" />
        </div>
        <div class="brand-text">
          <h2>SmartLook<span class="gradient-text">.AI</span></h2>
        </div>
      </a>
    </div>

    <div class="nav-actions">
      <button
        class="icon-btn"
        (click)="preferencias.toggleTema()"
        [title]="preferencias.tema() === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
      >
        <app-icon [name]="preferencias.tema() === 'dark' ? 'moon' : 'sun'" [size]="18" />
      </button>
      @if (auth.isLoggedIn()) {
        @if (auth.isCliente()) {
          <a routerLink="/mis-reservas" class="btn-secondary" style="display: inline-flex; align-items: center; gap: 0.4rem; text-decoration: none;">
            <app-icon name="package" [size]="16" /> Mis Reservas
          </a>
        }
        <span class="user-chip"><app-icon name="user" [size]="15" /> {{ auth.currentUser()?.nombre }}</span>
        <button class="icon-btn btn-logout" (click)="logout()" aria-label="Cerrar sesión">
          <app-icon name="logout" [size]="18" />
          <span class="tooltip">Cerrar sesión</span>
        </button>
      } @else {
        <a routerLink="/login" class="btn-secondary">Iniciar sesión</a>
        <a routerLink="/registro" class="btn-primary">Registrarme</a>
      }
    </div>
  </header>
  }

  <router-outlet></router-outlet>
</div>
