<div class="app-shell">
  @if (!hideNavbar()) {
  <header class="navbar">
    <div class="nav-left">
      @if (showSidebarToggle()) {
        <button
          class="sidebar-menu-btn"
          (click)="adminUi.toggleSidebar()"
          [title]="adminUi.sidebarOpen() ? 'Ocultar módulos' : 'Mostrar módulos'"
        >
          <app-icon name="menu" [size]="20" />
        </button>
      }
      <a routerLink="/" class="nav-brand">
        <div class="brand-logo">
          <app-icon name="sparkles" [size]="20" />
        </div>
        <div class="brand-text">
          <h2>SmartLook<span class="gradient-text">.AI</span></h2>
        </div>
      </a>
    </div>

    <div class="nav-actions">
      @if (auth.isLoggedIn()) {
        <span class="user-chip"><app-icon name="user" [size]="15" /> {{ auth.currentUser()?.nombre }}</span>
        <button class="btn-secondary" (click)="logout()">Cerrar sesión</button>
      } @else {
        <a routerLink="/login" class="btn-secondary">Iniciar sesión</a>
        <a routerLink="/registro" class="btn-primary">Registrarme</a>
      }
    </div>
  </header>
  }

  <router-outlet></router-outlet>
</div>
