services:
  # Postgres local para desarrollo. Para usarlo, en backend/.env:
  # DATABASE_URL=postgresql://smartlook:smartlook@db:5432/smartlook_ai
  # Si tu .env apunta a Supabase, este contenedor queda prendido pero sin usarse.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartlook
      POSTGRES_PASSWORD: smartlook
      POSTGRES_DB: smartlook_ai
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartlook -d smartlook_ai"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    # En local se recarga solo al editar el código (en producción el Dockerfile corre sin --reload).
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8001:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/app:/app/app
      - ./backend/seeds:/app/seeds
      - ./backend/migraciones:/app/migraciones
      - uploads_data:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend-web
    ports:
      - "4200:4200"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=500
    volumes:
      - ./frontend-web/src:/app/src
      - ./frontend-web/public:/app/public
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  uploads_data:
  pg_data:
